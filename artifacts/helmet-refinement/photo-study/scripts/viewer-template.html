<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>头盔模型 · 独立审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111d27;color:#e7eef3;font:16px/1.5 "Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:20px 28px;border-bottom:1px solid #354756}h1{font-size:24px;margin:0 0 6px}p{margin:0;color:#bac9d3}main{position:relative;flex:1;min-height:200px}canvas{width:100%;height:100%;display:block;touch-action:none}nav{position:absolute;top:20px;left:28px;right:28px;display:flex;gap:10px;flex-wrap:wrap}button,select,.file{color:#e7eef3;border:1px solid #5c7384;background:#233a49;padding:10px 16px;border-radius:6px;font:inherit;cursor:pointer}button:hover,.file:hover{background:#36576a}button:focus-visible,select:focus-visible,.file:focus-within{outline:3px solid #ffd38a;outline-offset:2px}input{max-width:170px}.file input{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}footer{padding:14px 28px;background:#1d2d39;font-size:14px}#status{color:#ffd38a;margin-bottom:4px}.hint{position:absolute;bottom:18px;left:28px;color:#c2d2dc;pointer-events:none}@media(max-width:650px){header,footer{padding:12px 16px}h1{font-size:20px}nav{left:16px;right:16px;top:12px;gap:6px}button,select,.file{font-size:14px;padding:8px 10px}}
</style></head><body><header><h1>照片实物头盔 · 外观研究样件</h1><p>首四张照片对应的对象；具体型号与尺寸待核实。供小组审阅，不是最终展览或 VR 性能演示。</p></header>
<main><canvas aria-label="可旋转的三维模型预览"></canvas><nav><label class="file">选择 GLB<input id="file" type="file" accept=".glb"></label><button data-view="overview">复位</button><button data-view="front">正面</button><button data-view="rear">背面</button><button data-view="left">侧面</button><select id="component" aria-label="选择查看部件"><option value="all">全部部件</option><option value="FrontWindowAssembly">仅前窗</option><option value="SideWindowsAssembly">仅侧窗</option><option value="CorseletAssembly">仅胸甲</option><option value="RearFittings">仅背部接头</option></select></nav><div class="hint">左键拖动旋转 · 滚轮缩放 · 右键拖动平移</div></main>
