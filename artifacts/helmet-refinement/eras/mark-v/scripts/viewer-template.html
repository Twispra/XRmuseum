<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark V · 精细模型审阅</title><style>
*{box-sizing:border-box}body{margin:0;background:#121c24;color:#e8edf1;font:16px/1.5 "Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:18px 24px;border-bottom:1px solid #34424e}h1{font-size:24px;margin:0 0 4px}p{margin:0;color:#aebfcb}main{position:relative;flex:1;min-height:250px}canvas{display:block;width:100%;height:100%;touch-action:none}nav{position:absolute;top:16px;left:24px;right:24px;display:flex;gap:8px;flex-wrap:wrap}button,select,.file{font:inherit;color:#e7eff3;border:1px solid #526879;background:#203342;border-radius:6px;padding:9px 13px;cursor:pointer}button:hover,.file:hover{background:#365165}button:focus-visible,select:focus-visible,.file:focus-within{outline:3px solid #e8bd79;outline-offset:2px}button:disabled{opacity:.45}.file input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}footer{padding:12px 24px;background:#1c2a35;font-size:14px}#status{color:#e9c68a;margin-bottom:3px}.hint{position:absolute;bottom:16px;left:24px;color:#b6c8d4;pointer-events:none}a{color:#c5d7e5}@media(max-width:700px){header,footer{padding:12px 16px}nav{left:16px;right:16px;gap:5px}button,select,.file{font-size:13px;padding:7px 9px}h1{font-size:20px}}</style></head><body>
<header><h1>Mark V Mod.1 · 精细模型</h1><p>1944 年 DESCO 馆藏件的外形研究 · 小组资产审阅</p></header>
<main><canvas aria-label="可旋转、缩放的 Mark V 三维模型"></canvas><nav>
<label class="file">选择 GLB<input id="file" type="file" accept=".glb"></label><button id="reset">复位</button><button data-view="front">正面</button><button data-view="rear">背面</button><button data-view="left">佩戴者左侧</button><button data-view="right">佩戴者右侧</button><button id="door">打开前窗</button><button id="shell">查看内部示意</button>
