<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface / Diver — equipment study</title>
<style>
:root{color-scheme:dark;--bg:#08131b;--panel:#14232c;--line:#2b404d;--text:#e8f0ee;--muted:#9bafb9;--accent:#9de3d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);gap:18px}.brand{font-size:11px;letter-spacing:.19em;color:var(--accent)}h1{font-size:24px;font-weight:500;letter-spacing:.025em;margin:3px 0 0}.version{font-size:12px;color:var(--muted)}button,select{font:inherit;background:#1a2e39;border:1px solid #38505d;color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover,select:hover{background:#294553}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a9e8df;outline-offset:3px}button:disabled{opacity:.4;cursor:wait}.active{background:#bde9dd!important;color:#10272a;border-color:#bde9dd!important}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;height:calc(100vh - 95px);min-height:590px}.viewport{min-height:0;display:flex;flex-direction:column;min-width:0;position:relative;background:radial-gradient(ellipse at 55% 40%,#20323d 0,#0e1d27 70%)}.viewbar{display:flex;flex-wrap:wrap;gap:7px;padding:15px 20px 0;z-index:1}.viewbar button{padding:7px 11px;font-size:13px;background:#182b35dd}.stageview{flex:1;min-height:300px;position:relative}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.label{position:absolute;pointer-events:none;font-size:12px;background:#11242dd9;border:1px solid #40606b;border-radius:5px;padding:4px 8px;color:#d5eae8;transform:translate(-50%,-50%);white-space:nowrap}.label.receiver{border-color:#b79b67}.caption{padding:5px 24px 12px;min-height:64px}#stage-title{font-size:19px;color:#d4f0e7;margin:0 0 3px}#stage-copy{color:var(--muted);font-size:14px;margin:0}.transport{padding:15px 20px;border-top:1px solid var(--line);background:#101f29}.playrow{display:flex;gap:9px;align-items:center}#play{min-width:110px;background:#c9e8db;color:#112a2b}#time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;margin-left:auto}#seek{width:100%;accent-color:#b0e4d6;cursor:pointer;margin:15px 0 3px}aside{padding:22px 18px;background:#10212a;border-left:1px solid var(--line);overflow:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:24px 0 10px}.steps{display:flex;flex-direction:column;gap:7px}.steps button{text-align:left;font-size:13px;background:transparent;display:flex;gap:12px;align-items:center}.steps .num{color:#6b909e;font-size:11px}.steps .active .num{color:#2f6665}.soundbox{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}.soundbox select{width:100%;margin:9px 0}.soundrow{display:flex;align-items:center;gap:9px;font-size:13px}.soundrow span{white-space:nowrap}.soundrow input[type=range]{width:100%;accent-color:var(--accent)}#audio-status,#status{font-size:11px;color:var(--muted);margin-top:8px}.switch{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:15px}details{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:12px}summary{cursor:pointer;color:#c4d6db}details a{color:var(--accent)}.help{color:#718b98;font-size:11px;margin-top:14px}@media(max-width:900px){.workspace{grid-template-columns:1fr;height:auto}.stageview{height:480px;flex:none}aside{border-left:none;border-top:1px solid var(--line)}.steps{flex-direction:row;flex-wrap:wrap}.eyebrow{margin-top:15px}header{padding:14px 18px}h1{font-size:20px}}
</style></head><body>
<header><div><div class="brand">SURFACE / DIVER · EQUIPMENT STUDY</div><h1 data-i18n="title">头盔之外，谁在支持潜水员？</h1></div><div><select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select><div class="version">R1 · Issue #33 · independent asset review</div></div></header>
<main class="workspace"><section class="viewport"><nav class="viewbar"><button data-camera="wide" data-i18n="wide">整体连接</button><button data-camera="source" data-i18n="source">水面设备</button><button data-camera="target" data-i18n="target">头盔接口</button><button id="inspect" data-i18n="inspect">展开设备细节</button></nav>
<div class="stageview"><canvas aria-label="3D equipment review"></canvas><div class="label" id="label-source"></div><div class="label receiver" id="label-target"></div><div class="label" id="label-detail"></div></div>
<div class="caption" aria-live="polite"><p id="stage-title"></p><p id="stage-copy"></p></div>
<div class="transport"><div class="playrow"><button id="play" disabled data-i18n="play">播放演示</button><button id="replay" disabled data-i18n="replay">重播这一步</button><button id="reset" disabled data-i18n="reset">复位</button><span id="time">0.0 / 16.0 s</span></div><input type="range" id="seek" min="0" max="16" value="0" step=".05" disabled aria-label="Timeline"><div id="status">Loading…</div></div></section>
<aside><div class="tabs"><button id="air" class="active" data-i18n="air">供气 AIR</button><button id="voice" data-i18n="voice">通话 VOICE</button></div><div class="eyebrow" data-i18n="steps">按步骤观察</div><div class="steps" id="steps"></div>
<div class="soundbox"><label class="soundrow"><input type="checkbox" id="sound"><span data-i18n="enableSound">开启声音试听</span></label><select id="sound-style" aria-label="Sound style"><option value="mechanical" data-i18n="mechanical">机械质感</option><option value="clear" data-i18n="clear">清楚提示</option><option value="gentle" data-i18n="gentle">低刺激</option></select><label class="soundrow"><span data-i18n="volume">音量</span><input type="range" id="volume" min="0" max="1" step=".01" value=".35" aria-label="Volume"></label><div id="audio-status"></div></div>
<label class="switch"><input type="checkbox" id="reduce"><span data-i18n="reduce">低动态：静态路径示意</span></label><details><summary data-i18n="evidence">资料与示意边界</summary><p data-i18n="boundary"></p><p><a href="https://diving-rov-specialists.com/index-b-documents_htm_files/history-34-us-navy_diving-manual-july-1916.pdf" target="_blank" rel="noopener">U.S. Navy Diving Manual · 1916</a> · pp.37–41 / Plates XII–XVI, XIX, L</p><p data-i18n="soundBoundary"></p></details><p class="help" data-i18n="help">左键旋转 · 滚轮缩放 · 右键平移。点步骤或拖动时间轴，会暂停在相应位置。</p></aside></main>
<script>window.REVIEW_ASSETS=__ASSETS__;</script><script>__BUNDLE__</script></body></html>
