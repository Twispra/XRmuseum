name: Static repository checks

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Check translations, Unity metadata, and documentation links
        run: python scripts/check_static_repository.py
